services:
  planscan:
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"

      # Router HTTPS
      - "traefik.http.routers.planscan-https.rule=Host(`planscan.holancloud.com`)"
      - "traefik.http.routers.planscan-https.entrypoints=websecure"
      - "traefik.http.routers.planscan-https.tls=true"
      - "traefik.http.routers.planscan-https.tls.certresolver=letsencrypt"

      # Servicio -> puerto interno
      - "traefik.http.routers.planscan-https.service=planscan-svc"
      - "traefik.http.services.planscan-svc.loadbalancer.server.port=3000"

networks:
  traefik_proxy:
    external: true
